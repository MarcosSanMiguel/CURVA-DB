<script>
    (function () {
        // ==========================================
        // CONFIGURATION
        // ==========================================
        const SHEET_ID = '1kn6ioZYQiyDaRjVWrisrVipOldxVCLyiBMOmf80mkqQ';
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyCuAQqe9X-lidTXDgmO93VZzLoVbapbOX2sZb0b1XAJU5buh0FY6mGKy1VhAtxEOC9Fg/exec';
        const PROFILE_BASE_URL = (function () {
            if (window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') return 'group.html';
            if (window.CURVA_PROFILE_URL) return window.CURVA_PROFILE_URL;
            const prefix = window.location.pathname.startsWith('/curva/') ? '/curva' : '';
            return prefix + '/group-profile/';
        })();

        const TIFO_TAG_BANK = {
            "Content Type": [
                "Tifo", "Chant", "Pyro", "Banner", "Match footage", "Protest",
                "March", "Documentary", "Interview", "Merchandise", "Charity event", "Historical archive"
            ],
            "Setting": [
                "Home game", "Away game", "Derby", "Street / March", "Community event"
            ],
            "Subject / Theme": [
                "Anti-fascist", "Fascist / Far-right", "Anti-racist", "Racist",
                "Feminism", "LGBTQ+", "Palestine", "Refugees", "Environment",
                "Anti-modern-football", "Fans' rights", "Anti-repression",
                "Violence", "Charity", "Volunteering"
            ]
        };

        let selectedTifoTags = new Set();

        function parseTags(tagString) {
            if (!tagString || typeof tagString !== 'string') return [];
            return tagString
                .replace(/(\d),(\d)/g, (m, d1, d2) => d1 + '__COMMA__' + d2)
                .split(',')
                .map(t => t.replace(/__COMMA__/g, ',').trim())
                .filter(Boolean);
        }

        window.initTifoTagBank = function () {
            const container = document.getElementById('tifoTagBankContainer');
            if (!container) return;

            const bankTags = new Set();
            for (const tags of Object.values(TIFO_TAG_BANK)) {
                tags.forEach(t => bankTags.add(t));
            }

            const customTags = [];
            selectedTifoTags.forEach(t => {
                if (!bankTags.has(t)) customTags.push(t);
            });

            let html = '';
            for (const [category, tags] of Object.entries(TIFO_TAG_BANK)) {
                html += `<div>
                    <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: #94a3b8; margin-bottom: 4px;">${category}</div>
                    <div class="curva-pill-selector">`;
                tags.forEach(t => {
                    const isSel = selectedTifoTags.has(t);
                    html += `<span class="curva-opt-pill ${isSel ? 'selected' : ''}" onclick="toggleTifoTag('${t.replace(/'/g, "\\'")}', this)">${t}</span>`;
                });
                html += `</div></div>`;
            }

            if (customTags.length > 0) {
                html += `<div>
                    <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: #94a3b8; margin-bottom: 4px;">Custom / Existing</div>
                    <div class="curva-pill-selector">`;
                customTags.forEach(t => {
                    html += `<span class="curva-opt-pill selected" onclick="toggleTifoTag('${t.replace(/'/g, "\\'")}', this)">${t}</span>`;
                });
                html += `</div></div>`;
            }

            container.innerHTML = html;
        };

        window.toggleTifoTag = function (tag, el) {
            if (selectedTifoTags.has(tag)) {
                selectedTifoTags.delete(tag);
                el.classList.remove('selected');
            } else {
                selectedTifoTags.add(tag);
                el.classList.add('selected');
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const currentTifoId = urlParams.get('tifoId');

        if (!currentTifoId) {
            document.getElementById('loading-state').style.display = 'none';
            const err = document.getElementById('error-state');
            err.style.display = 'block';
            err.innerHTML = '<h3>No Tifo ID Specified</h3><p>Please select a tifo item from the database gallery.</p>';
            return;
        }

        let tifoItem = null;
        let parentGroup = null;
        let allGroups = [];

        function parseGviz(text) {
            const start = text.indexOf('{');
            const end = text.lastIndexOf('}');
            return JSON.parse(text.slice(start, end + 1));
        }

        function safeStr(cell) {
            return (cell && cell.v != null) ? String(cell.v).trim() : '';
        }

        function getYouTubeId(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        const GVIZ_URL = tab => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${tab}`;

        function loadTifoData() {
            Promise.all([
                fetch(GVIZ_URL('Tifos')).then(r => r.text()),
                fetch(GVIZ_URL('Groups')).then(r => r.text())
            ]).then(([tTxt, gTxt]) => {
                const tRows = parseGviz(tTxt).table.rows || [];
                const gRows = parseGviz(gTxt).table.rows || [];

                allGroups = gRows.map(r => ({
                    id: safeStr(r.c[0]),
                    name: safeStr(r.c[1]),
                    club: safeStr(r.c[2]),
                    city: safeStr(r.c[3]),
                    country: safeStr(r.c[4])
                })).filter(g => g.id && g.id.toLowerCase() !== 'group_id');

                const matchT = tRows.find(r => safeStr(r.c[0]) === currentTifoId);
                if (!matchT) throw new Error(`Tifo entry '${currentTifoId}' was not found in the database.`);

                tifoItem = {
                    id: safeStr(matchT.c[0]),
                    groupId: safeStr(matchT.c[1]),
                    ultraGroup: safeStr(matchT.c[2]),
                    title: safeStr(matchT.c[3]),
                    year: safeStr(matchT.c[4]),
                    type: safeStr(matchT.c[5]),
                    link: safeStr(matchT.c[6]),
                    description: safeStr(matchT.c[7]),
                    thumbnailUrl: safeStr(matchT.c[8]),
                    tags: safeStr(matchT.c[9])
                };

                parentGroup = allGroups.find(g => g.id === tifoItem.groupId) || {
                    id: tifoItem.groupId,
                    name: tifoItem.ultraGroup || 'Ultra Group',
                    club: '',
                    city: '',
                    country: ''
                };

                renderTifoView();
                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('tifo-content').style.display = 'block';
                updateAdminUI();

            }).catch(err => {
                document.getElementById('loading-state').style.display = 'none';
                const errBox = document.getElementById('error-state');
                errBox.style.display = 'block';
                errBox.textContent = err.message;
            });
        }

        function renderTifoView() {
            const stage = document.getElementById('tifo-stage-container');
            const ytId = getYouTubeId(tifoItem.link);
            const isYt = (tifoItem.type && tifoItem.type.toLowerCase().includes('youtube')) || !!ytId;

            if (isYt && ytId) {
                stage.innerHTML = `
                    <div class="curva-video-wrap">
                        <iframe src="https://www.youtube.com/embed/${ytId}?autoplay=0&rel=0" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
                    </div>
                `;
            } else if (tifoItem.link || tifoItem.thumbnailUrl) {
                const imgSrc = tifoItem.link || tifoItem.thumbnailUrl;
                stage.innerHTML = `<img src="${imgSrc}" alt="${escapeHtml(tifoItem.title || 'Tifo Display')}" class="curva-stage-img" loading="lazy">`;
            } else {
                stage.innerHTML = `
                    <div class="curva-fallback-stage">
                        <h4 style="margin: 0; font-size: 16px; color: #fff;">${escapeHtml(tifoItem.title || 'Tifo Display')}</h4>
                        <p style="margin: 0; font-size: 13px; color: #94a3b8; max-width: 320px;">No media link provided for this entry.</p>
                    </div>
                `;
            }

            // Info Panel
            document.getElementById('tifo-type-label').textContent = isYt ? 'Tifo Video' : 'Tifo Display';

            const yearBadge = document.getElementById('tifo-year-badge');
            if (tifoItem.year) {
                yearBadge.textContent = tifoItem.year;
                yearBadge.style.display = 'inline-block';
            } else {
                yearBadge.style.display = 'none';
            }

            document.getElementById('tifo-title-text').textContent = tifoItem.title || 'Untitled Tifo Display';

            const descBox = document.getElementById('tifo-desc-text');
            if (tifoItem.description) {
                descBox.textContent = tifoItem.description;
                descBox.style.display = 'block';
            } else {
                descBox.innerHTML = '<em style="color:#94a3b8;">No description recorded for this tifo display.</em>';
            }

            // Parent Group & Club Callout
            const grpName = parentGroup ? parentGroup.name : (tifoItem.ultraGroup || 'Ultra Group');
            const clubText = parentGroup && parentGroup.club ? parentGroup.club : '';
            const locText = parentGroup && parentGroup.country ? (parentGroup.city ? `${parentGroup.city}, ${parentGroup.country}` : parentGroup.country) : '';
            const metaCombined = [clubText, locText].filter(Boolean).join(' · ');

            document.getElementById('tifo-group-name').textContent = grpName;
            document.getElementById('tifo-group-meta').textContent = metaCombined || 'View ultra group profile &rarr;';

            // Tags List
            const tagsList = document.getElementById('tifo-tags-list');
            const tagsSection = document.getElementById('tifo-tags-section');
            if (tagsList) {
                const parsed = parseTags(tifoItem.tags);
                if (parsed.length > 0) {
                    tagsList.innerHTML = parsed.map(t => `<span class="curva-badge">${escapeHtml(t)}</span>`).join('');
                    if (tagsSection) tagsSection.style.display = 'block';
                } else {
                    tagsList.innerHTML = '';
                    if (tagsSection) tagsSection.style.display = 'none';
                }
            }
        }

        window.goToGroupProfile = function () {
            if (tifoItem && tifoItem.groupId) {
                const base = (window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                    ? 'group.html'
                    : PROFILE_BASE_URL;
                window.location.href = `${base}?groupId=${tifoItem.groupId}`;
            }
        };

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // ==========================================
        // ADMIN EDIT & MUTATION
        // ==========================================

        function isAdmin() {
            return !!sessionStorage.getItem('curva_admin_passcode');
        }

        function updateAdminUI() {
            const badge = document.getElementById('curvaAdminStatus');
            const btnText = document.getElementById('curvaAdminBtnText');
            const viewPanel = document.getElementById('view-mode-panel');
            const editPanel = document.getElementById('edit-mode-panel');

            if (isAdmin()) {
                if (badge) {
                    badge.textContent = 'Admin Mode';
                    badge.classList.add('active');
                    badge.style.display = 'inline-block';
                }
                if (btnText) btnText.textContent = 'Lock / Exit';
                if (viewPanel) viewPanel.style.display = 'none';
                if (editPanel) editPanel.style.display = 'block';
                populateEditForm();
            } else {
                if (badge) {
                    badge.textContent = '';
                    badge.classList.remove('active');
                    badge.style.display = 'none';
                }
                if (btnText) btnText.textContent = 'Admin Access';
                if (viewPanel) viewPanel.style.display = 'block';
                if (editPanel) editPanel.style.display = 'none';
            }
        }

        function populateEditForm() {
            document.getElementById('editTifoTitle').value = tifoItem.title || '';
            document.getElementById('editTifoYear').value = tifoItem.year || '';
            document.getElementById('editTifoDesc').value = tifoItem.description || '';
            document.getElementById('editTifoLink').value = tifoItem.link || '';
            selectedTifoTags = new Set(parseTags(tifoItem.tags));
            initTifoTagBank();

            const grpSelect = document.getElementById('editTifoGroup');
            if (grpSelect) {
                grpSelect.innerHTML = allGroups.map(g => {
                    const sel = g.id === tifoItem.groupId ? 'selected' : '';
                    const sub = g.club ? `${g.club} · ${g.country}` : g.country;
                    return `<option value="${g.id}" ${sel}>${escapeHtml(g.name)} (${escapeHtml(sub)})</option>`;
                }).join('');
            }
        }

        window.cancelEditMode = function () {
            populateEditForm();
            sessionStorage.removeItem('curva_admin_passcode');
            updateAdminUI();
        };

        window.curvaToggleAdmin = async function () {
            if (isAdmin()) {
                sessionStorage.removeItem('curva_admin_passcode');
                updateAdminUI();
            } else {
                const pass = prompt('Enter team admin passcode:');
                if (!pass) return;

                const btnText = document.getElementById('curvaAdminBtnText');
                const orig = btnText.textContent;
                btnText.textContent = 'Verifying...';

                try {
                    const res = await callBackend({ action: 'verify_passcode', passcode: pass });
                    if (res && res.status === 'success') {
                        sessionStorage.setItem('curva_admin_passcode', pass);
                        updateAdminUI();
                    } else {
                        alert('Incorrect passcode.');
                    }
                } catch (e) {
                    alert('Verification error: ' + e.message);
                } finally {
                    btnText.textContent = isAdmin() ? 'Lock / Exit' : orig;
                }
            }
        };

        window.saveTifoEdits = async function () {
            const btn = document.getElementById('saveTifoEditBtn');
            btn.disabled = true;
            btn.textContent = 'Saving...';

            const newTitle = document.getElementById('editTifoTitle').value.trim();
            const newYear = document.getElementById('editTifoYear').value.trim();
            const newGroupId = document.getElementById('editTifoGroup').value;
            const newDesc = document.getElementById('editTifoDesc').value.trim();
            const newLink = document.getElementById('editTifoLink').value.trim();
            const newTags = Array.from(selectedTifoTags).join(', ');

            const selectedGrp = allGroups.find(g => g.id === newGroupId);
            const newUltraGroup = selectedGrp ? selectedGrp.name : tifoItem.ultraGroup;

            const ytId = getYouTubeId(newLink);
            const newType = ytId ? 'YouTube Video' : 'Image URL';
            const autoThumb = ytId ? `https://img.youtube.com/vi/${ytId}/mqdefault.jpg` : newLink;

            const updates = [{
                tifo_id: tifoItem.id,
                group_id: newGroupId,
                ultra_group: newUltraGroup,
                tifo_title: newTitle,
                year: newYear,
                media_type: newType,
                media_link: newLink,
                description: newDesc,
                thumbnail_url: autoThumb,
                tags: newTags
            }];

            try {
                await callBackend({
                    action: 'batch_update_tifos',
                    passcode: sessionStorage.getItem('curva_admin_passcode'),
                    updates: updates
                });

                tifoItem.title = newTitle;
                tifoItem.year = newYear;
                tifoItem.groupId = newGroupId;
                tifoItem.ultraGroup = newUltraGroup;
                tifoItem.type = newType;
                tifoItem.description = newDesc;
                tifoItem.link = newLink;
                tifoItem.thumbnailUrl = autoThumb;
                tifoItem.tags = newTags;
                parentGroup = selectedGrp || parentGroup;

                renderTifoView();
                alert('Tifo item updated successfully.');
            } catch (err) {
                alert('Failed to save changes: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Save Changes';
            }
        };

        window.deleteCurrentTifo = async function () {
            if (!confirm(`Are you sure you want to permanently delete tifo "${tifoItem.title}"?`)) return;
            try {
                await callBackend({
                    action: 'delete_tifo',
                    passcode: sessionStorage.getItem('curva_admin_passcode'),
                    tifoId: tifoItem.id
                });
                alert('Tifo item deleted.');
                goToGroupProfile();
            } catch (e) {
                alert('Failed to delete tifo: ' + e.message);
            }
        };

        async function callBackend(payload) {
            const res = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.status === 'error') throw new Error(data.message || 'Server error');
            return data;
        }

        loadTifoData();
    })();
</script>
