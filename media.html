<div id="curva-media-app">

    <!-- TOP NAVIGATION BAR -->
    <div class="curva-top-bar">
        <button onclick="window.history.back()" class="curva-back-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back
        </button>
        <div style="display: flex; align-items: center; gap: 10px;">
            <div class="curva-admin-badge" id="curvaAdminStatus">Public Mode</div>
            <button id="curvaAdminToggleBtn" class="curva-admin-btn" onclick="curvaToggleAdmin()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <span id="curvaAdminBtnText">Admin Access</span>
            </button>
        </div>
    </div>

    <!-- LOADING & ERROR STATES -->
    <div id="loading-state" class="curva-feedback-box">
        Loading media archive entry...
    </div>
    <div id="error-state" class="curva-feedback-box" style="display:none; color:#ef4444;"></div>

    <!-- MAIN MEDIA VIEW -->
    <div id="media-content" style="display: none;">
        <div class="curva-media-layout">
            
            <!-- LEFT COLUMN: MEDIA EMBED / VIEWER -->
            <div class="curva-media-stage">
                <div id="media-stage-container" class="curva-stage-inner"></div>
            </div>

            <!-- RIGHT COLUMN: DETAILS & METADATA -->
            <div class="curva-media-info">
                
                <!-- PUBLIC VIEW -->
                <div id="view-mode-panel">
                    <div class="curva-type-badge" id="media-type-label">Media</div>
                    <h1 class="curva-media-title" id="media-title-text">—</h1>
                    <div class="curva-parent-callout" id="media-group-callout" onclick="goToGroupProfile()">
                        <div class="curva-callout-sub">Documented Ultra Group</div>
                        <div class="curva-callout-name" id="media-group-name">—</div>
                        <div class="curva-callout-meta" id="media-group-meta">—</div>
                    </div>
                    
                    <div class="curva-desc-box" id="media-desc-text"></div>

                    <div class="curva-tags-section">
                        <div class="curva-tags-label">Tags</div>
                        <div class="curva-tags" id="media-tags-list"></div>
                    </div>
                </div>

                <!-- ADMIN INLINE EDIT MODE -->
                <div id="edit-mode-panel" style="display: none;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                        <span style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: #b3a369; letter-spacing: 0.8px;">Edit Media Item</span>
                        <button class="curva-btn-del" onclick="deleteCurrentMedia()">Delete Item</button>
                    </div>

                    <div class="curva-form-group">
                        <label>Media Title</label>
                        <input type="text" id="editMedTitle" class="curva-form-input">
                    </div>

                    <div class="curva-form-group">
                        <label>Description</label>
                        <textarea id="editMedDesc" class="curva-inline-textarea" style="min-height: 120px;"></textarea>
                    </div>

                    <div class="curva-form-group">
                        <label>Media Link / URL</label>
                        <input type="url" id="editMedLink" class="curva-form-input">
                    </div>

                    <div class="curva-form-group">
                        <label>Custom Thumbnail URL</label>
                        <input type="url" id="editMedThumb" class="curva-form-input">
                    </div>

                    <div class="curva-form-group">
                        <label>Tags (Comma Separated)</label>
                        <input type="text" id="editMedTags" class="curva-form-input">
                    </div>

                    <div style="display: flex; gap: 8px; margin-top: 20px;">
                        <button class="curva-btn-discard" onclick="cancelEditMode()">Cancel</button>
                        <button id="saveMediaEditBtn" class="curva-btn-save" onclick="saveMediaEdits()">Save Changes</button>
                    </div>
                </div>

            </div>

        </div>
    </div>

</div>

<style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap');

    #curva-media-app * { box-sizing: border-box; }
    #curva-media-app {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        background: #ffffff;
        color: #1e293b;
        max-width: 1200px;
        margin: 0 auto;
        padding-bottom: 60px;
    }

    .curva-feedback-box {
        padding: 60px 20px;
        text-align: center;
        font-size: 15px;
        color: #64748b;
    }

    /* TOP BAR */
    .curva-top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 20px;
        background: #111827;
        border-top-left-radius: 16px;
        border-top-right-radius: 16px;
    }
    .curva-back-btn {
        background: none;
        border: none;
        color: #cbd5e1;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: color 0.15s;
        font-family: inherit;
    }
    .curva-back-btn:hover { color: #b3a369; }

    .curva-admin-badge {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: #94a3b8;
        padding: 3px 8px;
        border-radius: 4px;
        background: #1e293b;
    }
    .curva-admin-badge.active { color: #22c55e; background: rgba(34, 197, 94, 0.15); }

    .curva-admin-btn {
        background: transparent;
        border: 1px solid #334155;
        color: #cbd5e1;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.2s;
    }
    .curva-admin-btn:hover { background: #1e293b; color: #fff; }

    /* MEDIA LAYOUT (GRID) */
    .curva-media-layout {
        display: grid;
        grid-template-columns: 1.25fr 1fr;
        gap: 40px;
        padding: 36px 28px;
        background: #ffffff;
    }

    /* MEDIA STAGE */
    .curva-media-stage {
        display: flex;
        flex-direction: column;
    }
    .curva-stage-inner {
        width: 100%;
        background: #0f172a;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #e2e8f0;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* EMBED STYLES */
    .curva-video-wrap {
        position: relative;
        width: 100%;
        padding-top: 56.25%;
    }
    .curva-video-wrap iframe {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        border: none;
    }

    .curva-stage-img {
        width: 100%;
        max-height: 540px;
        object-fit: contain;
        display: block;
        background: #0f172a;
    }

    .curva-fallback-stage {
        padding: 40px 24px;
        text-align: center;
        color: #cbd5e1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
    }

    /* RIGHT COLUMN CONTENT */
    .curva-type-badge {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #b3a369;
        margin-bottom: 8px;
    }

    .curva-media-title {
        font-family: 'DM Serif Display', serif;
        font-size: 28px;
        color: #0f172a;
        margin: 0 0 16px 0;
        line-height: 1.25;
    }

    .curva-parent-callout {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-left: 3px solid #b3a369;
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 24px;
        cursor: pointer;
        transition: all 0.15s;
    }
    .curva-parent-callout:hover {
        background: #f1f5f9;
        transform: translateX(2px);
    }
    .curva-callout-sub {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: #94a3b8;
        margin-bottom: 2px;
    }
    .curva-callout-name {
        font-size: 15px;
        font-weight: 600;
        color: #0f172a;
    }
    .curva-callout-meta {
        font-size: 12px;
        color: #64748b;
    }

    .curva-desc-box {
        font-size: 15px;
        color: #334155;
        line-height: 1.65;
        margin-bottom: 24px;
        white-space: pre-line;
    }

    .curva-tags-section {
        border-top: 1px solid #f1f5f9;
        padding-top: 18px;
    }
    .curva-tags-label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        color: #94a3b8;
        letter-spacing: 0.8px;
        margin-bottom: 8px;
    }
    .curva-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }
    .curva-badge {
        background: #f1f5f9;
        color: #475569;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
        display: inline-block;
    }

    /* EDIT FORM CONTROLS */
    .curva-form-group { margin-bottom: 14px; }
    .curva-form-group label {
        display: block;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        color: #64748b;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
    }
    .curva-form-input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        outline: none;
    }
    .curva-form-input:focus { border-color: #b3a369; }

    .curva-inline-textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;

        outline: none;
        resize: vertical;
        line-height: 1.5;

    .curva-btn-save {
        background: #b3a369;

        font-weight: 700;
        cursor: pointer;
    }
    .curva-btn-save:hover { background: #a39258; }

    .curva-btn-discard {
        background: transparent;
        color: #64748b;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 9px 14px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
    }
    .curva-btn-discard:hover { background: #f8fafc; color: #0f172a; }

    .curva-btn-del {
        background: #fee2e2;
        color: #dc2626;
        border: 1px solid #fecaca;
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
    }
    .curva-btn-del:hover { background: #fecaca; }

    .curva-external-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #1e293b;
        color: #fff;
        text-decoration: none;
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        margin-top: 12px;
    }
    .curva-external-btn:hover { background: #334155; }

    @media (max-width: 860px) {
        .curva-media-layout {
            grid-template-columns: 1fr;
            gap: 24px;
            padding: 20px 16px;
        }
    }
</style>

<script>
    (function () {
        // ==========================================
        // CONFIGURATION
        // ==========================================
        const SHEET_ID = '1kn6ioZYQiyDaRjVWrisrVipOldxVCLyiBMOmf80mkqQ';
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyCuAQqe9X-lidTXDgmO93VZzLoVbapbOX2sZb0b1XAJU5buh0FY6mGKy1VhAtxEOC9Fg/exec';
        const PROFILE_BASE_URL = 'https://sites.gatech.edu/curva/group-profile/';

        const urlParams = new URLSearchParams(window.location.search);
        const currentMediaId = urlParams.get('mediaId');

        if (!currentMediaId) {
            document.getElementById('loading-state').style.display = 'none';
            const err = document.getElementById('error-state');
            err.style.display = 'block';
            err.innerHTML = '<h3>No Media ID Specified</h3><p>Please select a media item from the database gallery.</p>';
            return;
        }

        let mediaItem = null;
        let parentGroup = null;

        function parseGviz(text) {
            const start = text.indexOf('{');
            const end = text.lastIndexOf('}');
            return JSON.parse(text.slice(start, end + 1));
        }

        function safeStr(cell) {
            return (cell && cell.v != null) ? String(cell.v).trim() : '';
        }

        function getYouTubeId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        const GVIZ_URL = tab => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${tab}`;

        function loadMediaData() {
            Promise.all([
                fetch(GVIZ_URL('Media')).then(r => r.text()),
                fetch(GVIZ_URL('Groups')).then(r => r.text())
            ]).then(([mTxt, gTxt]) => {
                const mRows = parseGviz(mTxt).table.rows || [];
                const gRows = parseGviz(gTxt).table.rows || [];

                const matchM = mRows.find(r => safeStr(r.c[0]) === currentMediaId);
                if (!matchM) throw new Error(`Media entry '${currentMediaId}' was not found in the database.`);

                mediaItem = {
                    id: safeStr(matchM.c[0]),
                    groupId: safeStr(matchM.c[1]),
                    groupName: safeStr(matchM.c[2]),
                    type: safeStr(matchM.c[3]),
                    link: safeStr(matchM.c[4]),
                    tags: safeStr(matchM.c[5]),
                    title: safeStr(matchM.c[6]),
                    description: safeStr(matchM.c[7]),
                    thumbnailUrl: safeStr(matchM.c[8])
                };

                const matchG = gRows.find(r => safeStr(r.c[0]) === mediaItem.groupId);
                if (matchG) {
                    parentGroup = {
                        id: safeStr(matchG.c[0]),
                        name: safeStr(matchG.c[1]),
                        club: safeStr(matchG.c[2]),
                        country: safeStr(matchG.c[4])
                    };
                }

                renderMediaView();
                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('media-content').style.display = 'block';
                updateAdminUI();

            }).catch(err => {
                document.getElementById('loading-state').style.display = 'none';
                const errBox = document.getElementById('error-state');
                errBox.style.display = 'block';
                errBox.textContent = err.message;
            });
        }

        function renderMediaView() {
            // Stage Embed
            const stage = document.getElementById('media-stage-container');
            const ytId = getYouTubeId(mediaItem.link);

            if (mediaItem.type === 'YouTube Video' && ytId) {
                stage.innerHTML = `
                    <div class="curva-video-wrap">
                        <iframe src="https://www.youtube.com/embed/${ytId}?autoplay=0&rel=0" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
                    </div>
                `;
            } else if (mediaItem.type === 'Image URL' || (mediaItem.link.match(/\.(jpeg|jpg|gif|png|webp)($|\?)/i))) {
                stage.innerHTML = `<img src="${mediaItem.link}" alt="${mediaItem.title}" class="curva-stage-img" loading="lazy">`;
            } else {
                const previewImg = mediaItem.thumbnailUrl 
                    ? `<img src="${mediaItem.thumbnailUrl}" style="max-height: 260px; border-radius: 8px; margin-bottom: 12px; object-fit: cover;">`
                    : '';

                stage.innerHTML = `
                    <div class="curva-fallback-stage">
                        ${previewImg}
                        <h4 style="margin: 0; font-size: 16px; color: #fff;">${mediaItem.type}</h4>
                        <p style="margin: 0; font-size: 13px; color: #94a3b8; max-width: 320px;">Direct native viewer not embedded for this link format.</p>
                        <a href="${mediaItem.link}" target="_blank" rel="noopener" class="curva-external-btn">
                            Open Original Link &nearr;
                        </a>
                    </div>
                `;
            }

            // Info Panel
            document.getElementById('media-type-label').textContent = mediaItem.type;
            document.getElementById('media-title-text').textContent = mediaItem.title || 'Untitled Archive Item';
            
            const descBox = document.getElementById('media-desc-text');
            if (mediaItem.description) {
                descBox.textContent = mediaItem.description;
                descBox.style.display = 'block';
            } else {
                descBox.innerHTML = '<em style="color:#94a3b8;">No description recorded for this item.</em>';
            }

            // Parent Group Box
            const grpName = parentGroup ? parentGroup.name : (mediaItem.groupName || 'Ultra Group');
            const grpMeta = parentGroup ? `${parentGroup.club} · ${parentGroup.country}` : '';
            document.getElementById('media-group-name').textContent = grpName;
            document.getElementById('media-group-meta').textContent = grpMeta;

            // Tags
            const tagContainer = document.getElementById('media-tags-list');
            const tags = mediaItem.tags.split(',').map(t => t.trim()).filter(Boolean);
            if (tags.length > 0) {
                tagContainer.innerHTML = tags.map(t => `<span class="curva-badge">${t}</span>`).join('');
            } else {
                tagContainer.innerHTML = '<span style="font-size:12px; color:#94a3b8;">No tags</span>';
            }
        }

        window.goToGroupProfile = function () {
            if (mediaItem && mediaItem.groupId) {
                window.location.href = `${PROFILE_BASE_URL}?groupId=${mediaItem.groupId}`;
            }
        };

        // ==========================================
        // ADMIN EDIT & MUTATION
        // ==========================================

        function isAdmin() {
            return !!sessionStorage.getItem('curva_admin_passcode');
        }

        function updateAdminUI() {
            const badge = document.getElementById('curvaAdminStatus');
            const btnText = document.getElementById('curvaAdminBtnText');
            const viewPanel = document.getElementById('view-mode-panel');
            const editPanel = document.getElementById('edit-mode-panel');

            if (isAdmin()) {
                badge.textContent = 'Admin Mode';
                badge.classList.add('active');
                btnText.textContent = 'Lock / Exit';
                viewPanel.style.display = 'none';
                editPanel.style.display = 'block';
                populateEditForm();
            } else {
                badge.textContent = 'Public Mode';
                badge.classList.remove('active');
                btnText.textContent = 'Admin Access';
                viewPanel.style.display = 'block';
                editPanel.style.display = 'none';
            }
        }

        function populateEditForm() {
            document.getElementById('editMedTitle').value = mediaItem.title || '';
            document.getElementById('editMedDesc').value = mediaItem.description || '';
            document.getElementById('editMedLink').value = mediaItem.link || '';
            document.getElementById('editMedThumb').value = mediaItem.thumbnailUrl || '';
            document.getElementById('editMedTags').value = mediaItem.tags || '';
        }

        window.cancelEditMode = function () {
            populateEditForm();
            sessionStorage.removeItem('curva_admin_passcode');
            updateAdminUI();
        };

        window.curvaToggleAdmin = async function () {
            if (isAdmin()) {
                sessionStorage.removeItem('curva_admin_passcode');
                updateAdminUI();
            } else {
                const pass = prompt('Enter team admin passcode:');
                if (!pass) return;

                const btnText = document.getElementById('curvaAdminBtnText');
                const orig = btnText.textContent;
                btnText.textContent = 'Verifying...';

                try {
                    const res = await callBackend({ action: 'verify_passcode', passcode: pass });
                    if (res && res.status === 'success') {
                        sessionStorage.setItem('curva_admin_passcode', pass);
                        updateAdminUI();
                    } else {
                        alert('Incorrect passcode.');
                    }
                } catch (e) {
                    alert('Verification error: ' + e.message);
                } finally {
                    btnText.textContent = isAdmin() ? 'Lock / Exit' : orig;
                }
            }
        };

        window.saveMediaEdits = async function () {
            const btn = document.getElementById('saveMediaEditBtn');
            btn.disabled = true;
            btn.textContent = 'Saving...';

            const newTitle = document.getElementById('editMedTitle').value.trim();
            const newDesc = document.getElementById('editMedDesc').value.trim();
            const newLink = document.getElementById('editMedLink').value.trim();
            const newThumb = document.getElementById('editMedThumb').value.trim();
            const newTags = document.getElementById('editMedTags').value.trim();

            const updates = [{
                media_id: mediaItem.id,
                media_title: newTitle,
                media_description: newDesc,
                media_link: newLink,
                thumbnail_url: newThumb,
                tags: newTags
            }];

            try {
                await callBackend({
                    action: 'batch_update_media',
                    passcode: sessionStorage.getItem('curva_admin_passcode'),
                    updates: updates
                });

                mediaItem.title = newTitle;
                mediaItem.description = newDesc;
                mediaItem.link = newLink;
                mediaItem.thumbnailUrl = newThumb;
                mediaItem.tags = newTags;

                renderMediaView();
                alert('Media item updated successfully.');
            } catch (err) {
                alert('Failed to save changes: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Save Changes';
            }
        };

        window.deleteCurrentMedia = async function () {
            if (!confirm(`Are you sure you want to delete "${mediaItem.title}"?`)) return;
            try {
                await callBackend({
                    action: 'delete_media',
                    passcode: sessionStorage.getItem('curva_admin_passcode'),
                    mediaId: mediaItem.id
                });
                alert('Item deleted.');
                goToGroupProfile();
            } catch (e) {
                alert('Failed to delete media item: ' + e.message);
            }
        };

        async function callBackend(payload) {
            const res = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.status === 'error') throw new Error(data.message || 'Server error');
            return data;
        }

        loadMediaData();
    })();
</script>
